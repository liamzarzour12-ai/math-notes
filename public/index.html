<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Google Docs</title>
    <link rel="icon" type="image/x-icon" href="https://gstatic.com">
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .browser-bar { display: flex; padding: 12px; background: #202020; gap: 12px; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .nav-btn { background: #333; border: none; color: white; padding: 12px 16px; cursor: pointer; border-radius: 8px; font-size: 16px; font-weight: bold; -webkit-tap-highlight-color: transparent; }
        .address-bar { flex-grow: 1; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #2b2b2b; color: white; font-size: 16px; }
        .frame-container { flex-grow: 1; width: 100%; height: 100%; -webkit-overflow-scrolling: touch; overflow-y: auto; }
        #browser-frame { width: 100%; height: 100%; border: none; background: white; display: block; }
    </style>
</head>
<body>

    <div class="browser-bar">
        <button class="nav-btn" onclick="document.getElementById('browser-frame').contentWindow.history.back()">←</button>
        <button class="nav-btn" onclick="document.getElementById('browser-frame').contentWindow.location.reload()">↻</button>
        <input type="text" id="address" class="address-bar" placeholder="Search Google or type a URL...">
        <button class="nav-btn" onclick="launchProxy()">Go</button>
    </div>

    <div class="frame-container">
        <iframe id="browser-frame" src="about:blank"></iframe>
    </div>

    <script src="/uv/uv.bundle.js"></script>
    <script src="/uv/uv.config.js"></script>
    <script>
        // Register the background service worker on launch
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/uv/uv.sw.js', {
                    scope: __uv$config.prefix
                });
            });
        }

        function launchProxy() {
            const input = document.getElementById('address').value;
            const iframe = document.getElementById('browser-frame');
            
            let url = input.trim();
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                if (url.includes('.') && !url.includes(' ')) {
                    url = 'https://' + url;
                } else {
                    url = 'https://google.com' + encodeURIComponent(url);
                }
            }
            // Scramble target URL using Ultraviolet configuration settings
            iframe.src = __uv$config.prefix + __uv$config.encodeUrl(url);
        }

        document.getElementById('address').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') launchProxy();
        });
    </script>
</body>
</html>
